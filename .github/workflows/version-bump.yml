name: version-bump

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  version-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Version follows the release branch and matches the README badge
        run: |
          released=$(git tag -l 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')
          base=$(git show "origin/$GITHUB_BASE_REF:.claude-plugin/plugin.json" | jq -r .version)
          [ -n "$released" ] || released=$base
          head=$(jq -r .version .claude-plugin/plugin.json)
          above() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]; }
          echo "released $released, base $base, head $head"
          if above "$base" "$released"; then
            [ "$head" = "$base" ] || { echo "::error file=.claude-plugin/plugin.json::$GITHUB_BASE_REF is already at the unreleased $base; keep that version"; exit 1; }
          elif ! above "$head" "$released"; then
            echo "::error file=.claude-plugin/plugin.json::bump the version above the released $released"
            exit 1
          fi
          grep -q "version-$head-blue" README.md || { echo "::error file=README.md::set the version badge to $head"; exit 1; }
