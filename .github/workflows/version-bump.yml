name: version-bump

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  version-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Version follows the release branch and matches the README badge
        env:
          BASE: ${{ github.base_ref }}
        run: sh scripts/ci/version.sh pr "$BASE"
