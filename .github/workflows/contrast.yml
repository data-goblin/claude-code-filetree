name: contrast

on:
  workflow_dispatch:
  push:
    branches: [main, 'release/**']
    paths: ['hooks/**', 'scripts/contrast.ts', '.github/workflows/contrast.yml']
  pull_request:
    paths: ['hooks/**', 'scripts/contrast.ts', '.github/workflows/contrast.yml']

permissions:
  contents: read

concurrency:
  group: contrast-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Did a color change
        id: colors
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          base="$BASE"
          if [ "$EVENT" = "workflow_dispatch" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff -U0 "$base" HEAD -- hooks scripts/contrast.ts .github/workflows/contrast.yml | grep -E '^[+-][^+-]' | grep -qiE '#[0-9a-f]{3}([0-9a-f]{3})?\b|contrast'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No color changed; contrast gate skipped."
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.colors.outputs.changed == 'true'
        with:
          bun-version: 1.3.13
          no-cache: true
      - name: Contrast gate
        if: steps.colors.outputs.changed == 'true'
        run: bun scripts/contrast.ts
